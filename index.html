<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- tints Safari's own chrome to the bed colour, so the strip behind a
     translucent toolbar reads as part of the flowers -->
<meta name="theme-color" content="#F0899F">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<!-- Hebrew: none of the hands above carry Hebrew glyphs, so the note
     would have fallen back to the system font. Gveret Levin is a Hebrew
     handwriting face; Assistant is the legible standby behind it. -->
<link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/note.css">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>

<!-- shown until the flower artwork has finished downloading -->
<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-art">
      <img class="loader-girl" id="loaderGirl" src="assets/img/ui/girl.png" alt="" draggable="false">
      <svg class="loader-bloom" viewBox="0 0 34 34" aria-hidden="true">
        <g>
          <ellipse cx="17" cy="6.6" rx="5.6" ry="6.1"/>
          <ellipse cx="27" cy="13.7" rx="5.6" ry="6.1" transform="rotate(72 27 13.7)"/>
          <ellipse cx="23.2" cy="25.6" rx="5.6" ry="6.1" transform="rotate(144 23.2 25.6)"/>
          <ellipse cx="10.8" cy="25.6" rx="5.6" ry="6.1" transform="rotate(216 10.8 25.6)"/>
          <ellipse cx="7" cy="13.7" rx="5.6" ry="6.1" transform="rotate(288 7 13.7)"/>
        </g>
        <circle class="pistil" cx="17" cy="17" r="3.4"/>
      </svg>
    </div>

    <p class="loader-title">Preparing something special...</p>

    <div class="loader-track" role="progressbar" aria-label="Loading"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="loaderBar">
      <div class="loader-fill" id="loaderFill"></div>
    </div>

    <p class="loader-note">Loading...</p>
  </div>
</div>

<!-- covers the screen while the letter takes its place -->
<div class="veil" id="veil"></div>

<div class="viewport">
  <!-- the buried blooms, flattened into a single painted layer -->
  <canvas class="bed-baked" id="bedBaked"></canvas>

  <!-- the blooms that stay live, so they can open under the pointer -->
  <div class="bed" id="bed"></div>

  <main class="stage" id="stage">

    <!-- The card: the note, plus the blooms tucked in front of it.
         Everything inside is positioned around the note's centre. -->
    <div class="card" id="card">

    <div class="note" id="note" role="button" tabindex="0"
         aria-label="Open the letter">
      <img class="note-paper" src="assets/img/ui/note-paper.jpg" alt="" draggable="false">

      <img class="girl" src="assets/img/ui/girl.png" alt="" draggable="false">

      <!-- pink heart, upper left of the greeting -->
      <svg class="deco heart-1" style="--rot:-8deg" viewBox="0 0 32 29" aria-hidden="true">
        <path d="M16 28C16 28 1.5 19.6 1.5 9.9 1.5 4.9 5.3 1.5 9.6 1.5c2.8 0 5.1 1.5 6.4 3.8C17.3 3 19.6 1.5 22.4 1.5c4.3 0 8.1 3.4 8.1 8.4C30.5 19.6 16 28 16 28Z"/>
      </svg>

      <!-- little five petal flower, right of "Birthday," -->
      <svg class="deco bloom-1" style="--rot:12deg" viewBox="0 0 34 34" aria-hidden="true">
        <g class="petals">
          <ellipse cx="17" cy="6.6" rx="5.6" ry="6.1"/>
          <ellipse cx="27" cy="13.7" rx="5.6" ry="6.1" transform="rotate(72 27 13.7)"/>
          <ellipse cx="23.2" cy="25.6" rx="5.6" ry="6.1" transform="rotate(144 23.2 25.6)"/>
          <ellipse cx="10.8" cy="25.6" rx="5.6" ry="6.1" transform="rotate(216 10.8 25.6)"/>
          <ellipse cx="7" cy="13.7" rx="5.6" ry="6.1" transform="rotate(288 7 13.7)"/>
        </g>
        <circle class="pistil" cx="17" cy="17" r="3.4"/>
      </svg>

      <!-- little five petal flower, left of the name -->
      <svg class="deco bloom-2" style="--rot:-14deg" viewBox="0 0 34 34" aria-hidden="true">
        <g class="petals">
          <ellipse cx="17" cy="6.6" rx="5.6" ry="6.1"/>
          <ellipse cx="27" cy="13.7" rx="5.6" ry="6.1" transform="rotate(72 27 13.7)"/>
          <ellipse cx="23.2" cy="25.6" rx="5.6" ry="6.1" transform="rotate(144 23.2 25.6)"/>
          <ellipse cx="10.8" cy="25.6" rx="5.6" ry="6.1" transform="rotate(216 10.8 25.6)"/>
          <ellipse cx="7" cy="13.7" rx="5.6" ry="6.1" transform="rotate(288 7 13.7)"/>
        </g>
        <circle class="pistil" cx="17" cy="17" r="3.4"/>
      </svg>

      <!-- pink heart, right of the name -->
      <svg class="deco heart-2" style="--rot:9deg" viewBox="0 0 32 29" aria-hidden="true">
        <path d="M16 28C16 28 1.5 19.6 1.5 9.9 1.5 4.9 5.3 1.5 9.6 1.5c2.8 0 5.1 1.5 6.4 3.8C17.3 3 19.6 1.5 22.4 1.5c4.3 0 8.1 3.4 8.1 8.4C30.5 19.6 16 28 16 28Z"/>
      </svg>

      <p class="greeting">
        <span class="l1">Happy</span>
        <span class="l2">Birthday,</span>
        <span class="l3" id="name">Sonia</span>
      </p>
    </div>


      <!-- nudge towards the card, a moment after the flowers settle -->
      <div class="hint" id="hint" aria-hidden="true">
        <svg class="hint-arrow" viewBox="0 0 76 88">
          <path class="curve" d="M68 84 C63 54 52 26 17 11"/>
          <path class="head" d="M17 11 L32 13 M17 11 L22 27"/>
        </svg>
        <span class="hint-text">click me!</span>
      </div>

      <!-- blooms that sit in front of the note -->
      <div class="bed-front" id="bedFront"></div>
    </div>



  </main>
</div>


  



<main class="note-page" id="page">

  <!-- One frame of blooms and doodles for the whole view. They are fixed
       to the window, so scrolling from the note to the gallery never cuts
       a flower in half at the seam between the two. -->
  <div class="note-blooms" aria-hidden="true">
    <img class="nb nb-tl" src="assets/img/flowers/f01.png" alt="" draggable="false">
    <img class="nb nb-tr" src="assets/img/flowers/f04.png" alt="" draggable="false">
    <img class="nb nb-bl" src="assets/img/flowers/f02.png" alt="" draggable="false">
    <img class="nb nb-br" src="assets/img/flowers/f01.png" alt="" draggable="false">
    <img class="nb nb-lm" src="assets/img/flowers/f02.png" alt="" draggable="false">
    <img class="nb nb-rm" src="assets/img/flowers/f04.png" alt="" draggable="false">
  </div>

  <div class="panel note-panel" id="noteMain">

  <div class="sheet">

    <header class="sheet-head">
      <h1 class="sheet-title" id="noteTitle">a birthday note</h1>


      <div class="sheet-rule" aria-hidden="true">
        <span class="dash"></span>
        <svg class="rule-heart" viewBox="0 0 32 29"><use href="#hrt"/></svg>
        <span class="dash"></span>
      </div>
    </header>

    <div class="sheet-doodles" aria-hidden="true">
      <svg class="hrt" style="--d:1.50s; --x:3%; --y:26%; --sz:24px; --r:-10deg"><use href="#hrt"/></svg>
      <svg class="hrt" style="--d:1.58s; --x:97%; --y:38%; --sz:26px; --r:12deg"><use href="#hrt"/></svg>
      <svg class="hrt" style="--d:1.66s; --x:96%; --y:66%; --sz:17px; --r:-6deg"><use href="#hrt"/></svg>
      <svg class="hrt" style="--d:1.74s; --x:4.5%; --y:78%; --sz:21px; --r:8deg"><use href="#hrt"/></svg>

      <span class="pip" style="--d:1.54s; --x:6%; --y:32%; --sz:7px"></span>
      <span class="pip" style="--d:1.62s; --x:2.5%; --y:44%; --sz:6px"></span>
      <span class="pip" style="--d:1.70s; --x:3.5%; --y:60%; --sz:6px"></span>
      <span class="pip" style="--d:1.78s; --x:7%; --y:74%; --sz:6px"></span>
      <span class="pip" style="--d:1.86s; --x:96%; --y:30%; --sz:7px"></span>
      <span class="pip" style="--d:1.94s; --x:97%; --y:54%; --sz:6px"></span>
      <span class="pip" style="--d:2.02s; --x:94.5%; --y:72%; --sz:6px"></span>
    </div>

    <div class="note-box">
      <svg class="note-frame" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
        <rect x="4" y="4" width="392" height="392" rx="9" ry="9"
              filter="url(#wobble)" vector-effect="non-scaling-stroke"/>
      </svg>

      <!-- sections are rendered from note.json -->
      <div class="note-scroll" id="noteScroll" tabindex="0">
        <div class="note-text" id="noteText"></div>
      </div>
    </div>

    <svg class="sheet-flowers" viewBox="0 0 118 172" aria-hidden="true">
      <g class="stems">
        <path d="M74 34 C74 76 62 104 55 168"/>
        <path d="M30 68 C34 100 47 122 55 168"/>
        <path d="M62 96 C74 88 86 88 95 94 C84 102 70 104 62 96Z" class="leaf"/>
        <path d="M46 122 C36 114 24 113 15 118 C25 127 39 129 46 122Z" class="leaf"/>
      </g>
      <g class="petals">
        <ellipse cx="74" cy="18" rx="10" ry="11.5"/>
        <ellipse cx="90" cy="29" rx="10" ry="11.5" transform="rotate(72 90 29)"/>
        <ellipse cx="84" cy="48" rx="10" ry="11.5" transform="rotate(144 84 48)"/>
        <ellipse cx="64" cy="48" rx="10" ry="11.5" transform="rotate(216 64 48)"/>
        <ellipse cx="58" cy="29" rx="10" ry="11.5" transform="rotate(288 58 29)"/>
      </g>
      <circle class="eye" cx="74" cy="34" r="4.4"/>
      <g class="petals">
        <ellipse cx="30" cy="54" rx="8" ry="9.2"/>
        <ellipse cx="43" cy="63" rx="8" ry="9.2" transform="rotate(72 43 63)"/>
        <ellipse cx="38" cy="78" rx="8" ry="9.2" transform="rotate(144 38 78)"/>
        <ellipse cx="22" cy="78" rx="8" ry="9.2" transform="rotate(216 22 78)"/>
        <ellipse cx="17" cy="63" rx="8" ry="9.2" transform="rotate(288 17 63)"/>
      </g>
      <circle class="eye" cx="30" cy="68" r="3.5"/>
    </svg>


    <button class="page-btn" data-next="gallery" type="button">
       תמונות שולר שלח לי
      <svg class="page-btn-icon" viewBox="0 0 18 16" aria-hidden="true">
        <path d="M1.5 8 L16 8 M10 2 L16.5 8 L10 14"/>
      </svg>
    </button>

  </div>

  </div><!-- /note-panel -->

  <!-- the gallery, a scroll below the note -->
  <section class="panel gallery-panel" id="gallery">


    <!-- carnations at the four corners only -->
    <div class="gal-side" aria-hidden="true">
      <img src="assets/img/flowers/f02.png" style="--gx:-3%;  --gy:-2%;  --gw:16%; --gr:-22deg" alt="">
      <img src="assets/img/flowers/f01.png" style="--gx:101%; --gy:-3%;  --gw:17%; --gr:20deg"  alt="">
      <img src="assets/img/flowers/f04.png" style="--gx:-4%;  --gy:101%; --gw:17%; --gr:-152deg" alt="">
      <img src="assets/img/flowers/f02.png" style="--gx:102%; --gy:102%; --gw:16%; --gr:150deg" alt="">
    </div>

    <div class="gal-stage">
      <!-- the title, in a speech bubble -->
      <div class="gal-title-bubble">
        <span id="galleryTitle">תמונות שולר שלח לי:</span>
        <svg class="bub-heart" viewBox="0 0 32 29" aria-hidden="true"><use href="#hrt-solid"/></svg>
      </div>

      <!-- photos are rendered from gallery.json -->
      <div class="shots" id="shots"></div>
    </div>

    <button class="page-btn gallery-next" data-next="video" type="button">
      סרטון
      <svg class="page-btn-icon" viewBox="0 0 18 16" aria-hidden="true">
        <path d="M1.5 8 L16 8 M10 2 L16.5 8 L10 14"/>
      </svg>
    </button>
  </section>


  <!-- a video, a scroll below the gallery -->
  <section class="panel video-panel" id="video">

    <!-- carnations at the four corners only -->
    <div class="gal-side" aria-hidden="true">
      <img src="assets/img/flowers/f03.png" style="--gx:-3%;  --gy:-2%;  --gw:16%; --gr:-18deg" alt="">
      <img src="assets/img/flowers/f06.png" style="--gx:101%; --gy:-3%;  --gw:17%; --gr:24deg"  alt="">
      <img src="assets/img/flowers/f01.png" style="--gx:-4%;  --gy:101%; --gw:17%; --gr:-148deg" alt="">
      <img src="assets/img/flowers/f04.png" style="--gx:102%; --gy:102%; --gw:16%; --gr:154deg" alt="">
    </div>

    <div class="vid-stage">
      <!-- the title, in a speech bubble -->
      <div class="gal-title-bubble vid-title">
        <span>שאת נוחרת</span>
        <svg class="bub-heart" viewBox="0 0 32 29" aria-hidden="true"><use href="#hrt-solid"/></svg>
      </div>

      <div class="vid-frame" id="vidFrame">
        <video class="vid-el" id="vidEl" playsinline preload="metadata"
               src="assets/img/video/sonia-sleep.mp4"></video>

        <!-- the big play badge, over the picture while it is stopped -->
        <button class="vid-badge" id="vidBadge" type="button" aria-label="Play the video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 L18.5 12 L8 18.5 Z"/></svg>
        </button>

        <!-- the controls, along the bottom lip -->
        <div class="vid-bar">
          <button class="vid-btn vid-play" id="vidPlay" type="button" aria-label="Play">
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 L18.5 12 L8 18.5 Z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 h3.2 v13 h-3.2 Z M12.8 5.5 h3.2 v13 h-3.2 Z"/></svg>
          </button>

          <input class="vid-seek" id="vidSeek" type="range" min="0" max="1000" value="0"
                 aria-label="Seek">

          <span class="vid-time"><span id="vidNow">0:00</span> / <span id="vidTotal">0:00</span></span>

          <button class="vid-btn vid-mute" id="vidMute" type="button" aria-label="Mute">
            <svg class="ic-loud" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5 h3.5 L12 5.5 v13 L7.5 14.5 H4 Z"/>
              <path class="wv" d="M15 9.2 a4 4 0 0 1 0 5.6 M17.6 6.8 a7.4 7.4 0 0 1 0 10.4"/>
            </svg>
            <svg class="ic-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5 h3.5 L12 5.5 v13 L7.5 14.5 H4 Z"/>
              <path class="wv" d="M15.5 9.5 L20.5 14.5 M20.5 9.5 L15.5 14.5"/>
            </svg>
          </button>

          <button class="vid-btn vid-full" id="vidFull" type="button" aria-label="Full screen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="wv" d="M4 9 V4 h5 M15 4 h5 v5 M20 15 v5 h-5 M9 20 H4 v-5"/>
            </svg>
          </button>
        </div>

        <!-- two paper stickers, pinned to the frame -->
        <span class="vid-sticker vid-heart" aria-hidden="true"></span>
        <span class="vid-sticker vid-flower" aria-hidden="true"></span>
      </div>
    </div>

    <button class="page-btn video-next" data-next="closing" type="button">
      ודבר אחרון
      <svg class="page-btn-icon" viewBox="0 0 18 16" aria-hidden="true">
        <path d="M1.5 8 L16 8 M10 2 L16.5 8 L10 14"/>
      </svg>
    </button>
  </section>


  <!-- the last word, and the way home -->
  <section class="panel closing-panel" id="closing">
    <div class="closing-inner">

      <!-- the gift: three presses and it goes off -->
      <div class="gift-stage" id="giftStage">
        <button class="gift" id="gift" type="button" aria-label="פתחי את המתנה">
          <img src="assets/img/ui/pink-gift-transparent.png" alt="" draggable="false">
        </button>
        <!-- the petals thrown out on the third press land here -->
        <div class="gift-burst" id="giftBurst" aria-hidden="true"></div>

        <!-- What is inside. It shares the gift's own square, so the words
             arrive where the box was rather than under the gap it leaves. -->
        <div class="gift-reveal" id="giftReveal" hidden>
          <!-- ":P" is left-to-right; loose in an RTL line it came out "P:" -->
          <p class="closing-line" dir="rtl">את המתנות ולר כבר אמר לך <span dir="ltr">:P</span></p>
          <svg class="closing-heart" viewBox="0 0 32 29" aria-hidden="true"><use href="#hrt"/></svg>
          <p class="closing-sub" dir="rtl">יום הולדת שמח &#9829;</p>
        </div>
      </div>

      <p class="gift-hint" id="giftHint" dir="rtl">לחצי על המתנה</p>

      <button class="closing-btn" id="backBtn" type="button">
        <svg class="closing-btn-icon" viewBox="0 0 16 18" aria-hidden="true">
          <path d="M8 16.5 L8 2 M2 8 L8 1.5 L14 8"/>
        </svg>
        back to the flowers
      </button>
    </div>
  </section>

  <!-- On a phone a page can be taller than the screen. This sits outside
       the panels, so it holds still while one scrolls under it, and shows
       itself only while there is more of the page left to see. -->
  <button class="scroll-cue" id="scrollCue" type="button" aria-label="Scroll down for more">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 9.5 L12 15.5 L18 9.5"/>
    </svg>
  </button>

</main>

<!-- a photo, opened large -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">&#215;</button>
  <figure class="lb-frame">
    <img class="lb-img" id="lbImg" src="" alt="">
    <figcaption class="lb-note" id="lbNote"></figcaption>
  </figure>
</div>

<!-- shared bits: the heart outline and the hand-drawn wobble -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hrt" viewBox="0 0 32 29">
    <path d="M16 27.5C16 27.5 2 19.4 2 10.2 2 5.5 5.6 2.2 9.7 2.2c2.7 0 4.9 1.4 6.3 3.6 1.4-2.2 3.6-3.6 6.3-3.6 4.1 0 7.7 3.3 7.7 8C30 19.4 16 27.5 16 27.5Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="hrt-solid" viewBox="0 0 32 29">
    <path d="M16 27.5C16 27.5 2 19.4 2 10.2 2 5.5 5.6 2.2 9.7 2.2c2.7 0 4.9 1.4 6.3 3.6 1.4-2.2 3.6-3.6 6.3-3.6 4.1 0 7.7 3.3 7.7 8C30 19.4 16 27.5 16 27.5Z"
          fill="currentColor"/>
  </symbol>
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="assets/js/script.js"></script>
</body>
</html>
